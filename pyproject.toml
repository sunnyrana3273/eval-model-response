[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-observatory"
version = "0.1.0"
description = "Detect, predict, and mitigate unsafe or goal-inconsistent behaviour in LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.40"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
afo = "afo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hf: requires torch + transformers",
  "slow: longer integration tests",
]
